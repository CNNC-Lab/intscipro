name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (errors only)
        run: flake8 .
      - name: Unit tests
        run: pytest
      - name: Notebooks are committed without outputs
        run: python .github/scripts/check_notebooks.py
      - name: Examples and solutions run
        run: python .github/scripts/run_scripts.py
