[flake8]
# CI lints for real errors only (syntax errors, undefined names, invalid comparisons).
# Teaching scripts favour readability over strict style; run `black` and the full
# flake8 rule set on your own project code.
select = E9,F63,F7,F82
# The broken_*.py scripts contain deliberate errors for an exercise
exclude = .git,__pycache__,outputs,day02-fundamentals/setup/broken_*.py

[tool:pytest]
testpaths = day07-intermediate/solutions
